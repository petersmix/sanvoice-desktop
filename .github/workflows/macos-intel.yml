# Builds SANVOICE for Intel Macs (x86_64). The app is uploaded unsigned and is signed and
# notarized afterwards with the SANVOICE Developer ID, the same way as the Apple silicon build.
name: macOS Intel build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The Linphone SDK computes its version with `git describe`, which needs the submodules' tags.
      - name: Fetch submodule tags
        run: git submodule foreach --recursive 'git fetch --tags --unshallow 2>/dev/null || git fetch --tags || true'

      - name: Build tools
        run: brew install nasm yasm ninja meson doxygen pkg-config || true

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtnetworkauth qtshadertools qt5compat

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python modules
        run: python -m pip install pystache six

      - name: Configure
        run: >
          cmake -S . -B build-desktop -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLINPHONEAPP_MACOS_ARCHS=x86_64
          -DLINPHONEAPP_VERSION=1.0.0
          -DENABLE_UPDATE_CHECK=OFF
          -DPython3_EXECUTABLE="$pythonLocation/bin/python"

      - name: Build
        run: cmake --build build-desktop --target install app_macos-x86_64 --parallel 4

      - name: Zip app
        if: always()
        run: |
          APP=$(ls -d build-desktop/OUTPUT/macos-x86_64/*.app 2>/dev/null | head -1)
          if [ -n "$APP" ]; then ditto -c -k --keepParent "$APP" SANVOICE-macos-x86_64.zip; fi

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANVOICE-macOS-Intel
          path: SANVOICE-macos-x86_64.zip
          if-no-files-found: warn
          retention-days: 30
